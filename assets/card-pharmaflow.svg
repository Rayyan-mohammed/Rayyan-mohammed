<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-labelledby="t d"><title id="t">PharmaFlow Pro: Pharmacy ERP with role-based access, audit logging and inventory controls.</title><desc id="d">PharmaFlow Pro project card. Role: sole author. Key results: 31 tables in the relational schema; 3 roles + per-action permission matrix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6774"/></marker><marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#232B35"/></pattern><radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="rule" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10B981"/><stop offset="35%" stop-color="#22D3EE" stop-opacity="0.6"/><stop offset="100%" stop-color="#232B35" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="208" rx="16" fill="#0B0E12"/><rect width="1200" height="208" rx="16" fill="url(#dots)" opacity="0.55"/><rect x="0.5" y="0.5" width="1199" height="207" rx="15.5" fill="none" stroke="#232B35"/><text x="36" y="54" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="1">07</text><text x="74" y="54" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.6">SOFTWARE SYSTEMS  ·  SECURITY  ·  AWS</text><rect x="1047" y="34" width="117" height="30" rx="15" fill="#141A21" stroke="#10B981" stroke-opacity="0.55"/><circle cx="1062" cy="49" r="3.5" fill="#10B981"/><text x="1071.77" y="54" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">SOLE AUTHOR</text><text x="34" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="0.5">PharmaFlow Pro</text><text x="36" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8E9AA8" text-anchor="start">Pharmacy ERP with role-based access, audit logging and inventory controls.</text><text x="36.0" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="650" fill="#34D399" text-anchor="start">31</text><text x="36.0" y="186" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8E9AA8" text-anchor="start">tables in the relational schema</text><line x1="582" y1="132" x2="582" y2="186" stroke="#232B35"/><text x="600.0" y="162" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="650" fill="#E6EDF3" text-anchor="start">3 roles</text><text x="600.0" y="186" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8E9AA8" text-anchor="start">+ per-action permission matrix</text></svg>
