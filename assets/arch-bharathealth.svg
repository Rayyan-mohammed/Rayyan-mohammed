<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-labelledby="t d"><title id="t">BHARATHEALTH ANALYST architecture</title><desc id="d">Question → planned tool calls → grounded answer → measured. Stages: data: NFHS-5 + NFHS-4, DVC pipeline; index: Parquet + schema, ChromaDB; agent: LangGraph ReAct, 7 tools, Restricted exec; serve: FastAPI, Static web app; evaluate: 200-Q benchmark, EA 71.1% · HR 5%. Ops: Watchdog keeps the API and Cloudflare tunnel alive. Explore runs offline from data baked into the page.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6774"/></marker><marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#232B35"/></pattern><radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="rule" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10B981"/><stop offset="35%" stop-color="#22D3EE" stop-opacity="0.6"/><stop offset="100%" stop-color="#232B35" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="506" rx="16" fill="#0B0E12"/><rect width="1200" height="506" rx="16" fill="url(#dots)" opacity="0.55"/><rect x="0.5" y="0.5" width="1199" height="505" rx="15.5" fill="none" stroke="#232B35"/><text x="36" y="50" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#34D399" text-anchor="start" letter-spacing="1.5">BHARATHEALTH ANALYST</text><text x="36" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#E6EDF3" text-anchor="start">Question → planned tool calls → grounded answer → measured</text><text x="1164" y="50" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5C6774" text-anchor="end">sole author · end to end</text><text x="36.0" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">01  DATA</text><rect x="36.0" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="49.0" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">NFHS-5 + NFHS-4</text><text x="49.0" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">706 × 448 columns</text><rect x="36.0" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="49.0" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">DVC pipeline</text><text x="49.0" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">byte-identical repro</text><text x="267.2" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">02  INDEX</text><rect x="267.2" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="280.2" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Parquet + schema</text><text x="280.2" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">imputed cells flagged</text><rect x="267.2" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="280.2" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">ChromaDB</text><text x="280.2" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">MiniLM embeddings</text><text x="498.4" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">03  AGENT</text><rect x="498.4" y="138.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="498.4" y="152.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="511.4" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">LangGraph ReAct</text><text x="511.4" y="189.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">plans tool chains</text><rect x="498.4" y="220.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="498.4" y="234.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="511.4" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">7 tools</text><text x="511.4" y="271.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">search·pandas·SQL·chart</text><rect x="498.4" y="302.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="511.4" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Restricted exec</text><text x="511.4" y="353.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">whitelisted pandas</text><text x="729.5999999999999" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">04  SERVE</text><rect x="729.6" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="742.5999999999999" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">FastAPI</text><text x="742.5999999999999" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">11 endpoints, limits</text><rect x="729.6" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="742.5999999999999" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Static web app</text><text x="742.5999999999999" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">Ask·Explore·Correlate</text><text x="960.8" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">05  EVALUATE</text><rect x="960.8" y="179.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="960.8" y="193.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="973.8" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">200-Q benchmark</text><text x="973.8" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">computed ground truth</text><rect x="960.8" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="973.8" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">EA 71.1% · HR 5%</text><text x="973.8" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">5 metrics, resumable</text><line x1="243.2" y1="254.0" x2="263.2" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="474.4" y1="254.0" x2="494.4" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="705.6" y1="254.0" x2="725.6" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="936.8" y1="254.0" x2="956.8" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="36" 