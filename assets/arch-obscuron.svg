<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-labelledby="t d"><title id="t">OBSCURON architecture</title><desc id="d">Retrospective validation: freeze the past, grade against the future. Stages: snapshots: GTDB R207 · Pfam 35, Pfam 37 proxy; label: Snapshot diffing, 4,138 positives; embed: ESM-2 650M, Genos-m 4.7B, ProstT5; score: L1 kNN + GPD, L3 neg. selection, L2 · L4 · L5; evaluate: Held-out family, Calibration. Leakage Control: Pretraining cut-offs checked against the T0→T1 window. Raw data streamed, never warehoused.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6774"/></marker><marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#232B35"/></pattern><radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="rule" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10B981"/><stop offset="35%" stop-color="#22D3EE" stop-opacity="0.6"/><stop offset="100%" stop-color="#232B35" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="506" rx="16" fill="#0B0E12"/><rect width="1200" height="506" rx="16" fill="url(#dots)" opacity="0.55"/><rect x="0.5" y="0.5" width="1199" height="505" rx="15.5" fill="none" stroke="#232B35"/><text x="36" y="50" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#34D399" text-anchor="start" letter-spacing="1.5">OBSCURON</text><text x="36" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI'