e UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">L3 neg. selection</text><text x="742.5999999999999" y="271.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">self / non-self</text><rect x="729.6" y="302.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="742.5999999999999" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">L2 · L4 · L5</text><text x="742.5999999999999" y="353.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">struct · conv · coding</text><text x="960.8" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">05  EVALUATE</text><rect x="960.8" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="973.8" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Held-out family</text><text x="973.8" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">AUROC 0.962</text><rect x="960.8" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="973.8" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Calibration</text><text x="973.8" y="312.0" font-famil