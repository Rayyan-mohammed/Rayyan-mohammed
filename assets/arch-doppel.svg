<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-labelledby="t d"><title id="t">DOPPEL architecture</title><desc id="d">Generators are graded on one dataset, one protocol, one environment. Stages: data: MIMIC-III Demo, Patient split; generate: Shared codec, 4 families; evaluate: Fidelity, Utility, Privacy; calibrate: Attack controls, Worst-of-3; decide: Pareto frontier, React dashboard. Scale: 180 runs: 9 arms × 20 seeds. Docker images and Kubernetes Jobs exist; stages are launched manually.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6774"/></marker><marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10B981"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#232B35"/></pattern><radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="rule" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10B981"/><stop offset="35%" stop-color="#22D3EE" stop-opacity="0.6"/><stop offset="100%" stop-color="#232B35" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="506" rx="16" fill="#0B0E12"/><rect width="1200" height="506" rx="16" fill="url(#dots)" opacity="0.55"/><rect x="0.5" y="0.5" width="1199" height="505" rx="15.5" fill="none" stroke="#232B35"/><text x="36" y="50" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#34D399" text-anchor="start" letter-spacing="1.5">DOPPEL</text><text x="36" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#E6EDF3" text-anchor="start">Generators are graded on one dataset, one protocol, one environment</text><text x="1164" y="50" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5C6774" text-anchor="end">my track: 03 + 04</text><text x="36.0" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">01  DATA</text><rect x="36.0" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="49.0" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">MIMIC-III Demo</text><text x="49.0" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">129 admissions</text><rect x="36.0" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="49.0" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Patient split</text><text x="49.0" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">94 train · 35 holdout</text><text x="267.2" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">02  GENERATE</text><rect x="267.2" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="280.2" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Shared codec</text><text x="280.2" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">110-col frame</text><rect x="267.2" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="280.2" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">4 families</text><text x="280.2" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">copula·GAN·VAE·diff</text><text x="498.4" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">03  EVALUATE</text><rect x="498.4" y="138.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="498.4" y="152.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="511.4" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Fidelity</text><text x="511.4" y="189.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">JSD · corr · KS</text><rect x="498.4" y="220.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="498.4" y="234.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="511.4" y="248.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Utility</text><text x="511.4" y="271.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">train syn, test real</text><rect x="498.4" y="302.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="498.4" y="316.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="511.4" y="330.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Privacy</text><text x="511.4" y="353.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">shadow-model MIA</text><text x="729.5999999999999" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">04  CALIBRATE</text><rect x="729.6" y="179.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="729.6" y="193.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="742.5999999999999" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Attack controls</text><text x="742.5999999999999" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">ceiling · floor</text><rect x="729.6" y="261.0" width="203.2" height="68" rx="10" fill="#141A21" stroke="#10B981" stroke-opacity="0.8"/><rect x="729.6" y="275.0" width="3" height="40" rx="1.5" fill="#10B981"/><text x="742.5999999999999" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Worst-of-3</text><text x="742.5999999999999" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">privacy score</text><text x="960.8" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start" letter-spacing="0.8">05  DECIDE</text><rect x="960.8" y="179.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="973.8" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">Pareto frontier</text><text x="973.8" y="230.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">bootstrap sensitivity</text><rect x="960.8" y="261.0" width="203.2" height="68" rx="10" fill="#10151B" stroke="#232B35" stroke-opacity="1"/><text x="973.8" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="start">React dashboard</text><text x="973.8" y="312.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8E9AA8" text-anchor="start">score your own file</text><line x1="243.2" y1="254.0" x2="263.2" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="474.4" y1="254.0" x2="494.4" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="705.6" y1="254.0" x2="725.6" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="936.8" y1="254.0" x2="956.8" y2="254.0" stroke="#5C6774" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="36" y="406" width="1128" height="56" rx="10" fill="#10151B" stroke="#232B35" stroke-dasharray="4 4"/><text x="52" y="440" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#22D3EE" text-anchor="start" letter-spacing="0.8">SCALE</text><text x="109.65" y="440" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8E9AA8" text-anchor="start">180 runs: 9 arms × 20 seeds. Docker images and Kubernetes Jobs exist; stages are launched manually.</text></svg>
