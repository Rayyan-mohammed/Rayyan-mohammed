name: Profile assets

# Builds the two live images the README reads from the `output` branch:
#   activity.svg          GitHub activity panel (scripts/activity.py, GitHub GraphQL API)
#   github-contribution-grid-snake*.svg
# If a step fails, nothing is pushed and the previous images stay published.

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/activity.py"
      - "scripts/build_assets.py"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Activity panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/activity.py "${{ github.repository_owner }}" dist/activity.svg

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#ebedf0,#a7f3d0,#6ee7b7,#34d399,#10b981
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#34D399&color_dots=#161b22,#064e3b,#047857,#10b981,#34d399

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
